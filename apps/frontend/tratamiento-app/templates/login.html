<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingresar · Mi tratamiento</title>
<meta name="theme-color" content="#0E2A47">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="phone">
  <header class="top">
    <p class="eyebrow">Mi tratamiento</p>
    <h1>Ingresar</h1>
    <p class="sub">Demo del hackatón · datos de ejemplo</p>
  </header>
  <main class="content">
    {% if error %}<div class="card alerta" role="alert"><p>{{ error }}</p></div>{% endif %}
    <form method="post" class="card" style="gap:14px">
      <div class="campo"><label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="username" required
               value="{{ request.form.email or '' }}"></div>
      <div class="campo"><label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit">Ingresar</button>
    </form>

    <section class="card" aria-label="Usuarios de prueba">
      <h2>Usuarios de prueba</h2>
      <p class="muted">Contraseña de todos: <b>{{ password_demo }}</b>. Toca uno para llenar el correo.</p>
      {% for email, nombre in usuarios %}
      <button type="button" class="btn sec chico" data-email="{{ email }}">{{ nombre }}</button>
      {% endfor %}
    </section>
  </main>
</div>
<script>
  document.querySelectorAll('[data-email]').forEach((b) => b.addEventListener('click', () => {
    document.getElementById('email').value = b.dataset.email;
    document.getElementById('password').focus();
  }));
</script>
</body>
</html>
