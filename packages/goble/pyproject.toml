[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goble"
version = "0.1.0"
description = "Núcleo hexagonal (dominio + aplicación + adapters) compartido por lambdas y frontend"
requires-python = ">=3.12"
dependencies = []  # boto3 viene incluido en el runtime de Lambda

[tool.setuptools.packages.find]
where = ["src"]
