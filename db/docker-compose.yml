services:
  postgres:
    image: postgres:17-alpine
    container_name: goble-postgres
    environment:
      POSTGRES_USER: goble
      POSTGRES_PASSWORD: goble
      POSTGRES_DB: tratamiento
      TZ: America/Guayaquil
    # Zona horaria de Ecuador: CURRENT_DATE y las horas de las tomas cuadran con la app
    command: ["postgres", "-c", "timezone=America/Guayaquil"]
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      # Los .sql de init/ corren en orden alfabético SOLO la primera vez (volumen vacío)
      - ./init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goble -d tratamiento"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
