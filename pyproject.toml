[tool.pytest.ini_options]
# Desde la raíz: `pytest` corre las pruebas de la app (con DATABASE_URL, también contra PostgreSQL)
pythonpath = ["apps/frontend/tratamiento-app"]
testpaths = ["apps/frontend/tratamiento-app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
